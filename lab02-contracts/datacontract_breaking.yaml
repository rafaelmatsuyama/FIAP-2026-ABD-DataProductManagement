dataContractSpecification: 0.9.3
id: urn:datacontract:fintech:transactions:v2-breaking
info:
  title: Financial Risk & Payment Transactions Product (Breaking Scenario)
  version: 2.0.0
  status: draft
  description: Contract with deliberate breaking changes to demonstrate Shift-Left Quality Gate intervention.
  owner: Fraud Prevention & Risk Analytics Squad

servers:
  local:
    type: duckdb
    database: data/analytics.duckdb

models:
  transactions:
    description: Transaction events with intentionally incompatible schema and business constraints.
    type: table
    fields:
      transaction_id:
        type: varchar
        primary: true
        required: true
        unique: true
      customer_id:
        type: varchar
        required: true
      amount:
        type: decimal
        required: true
        # ⚠️ BREAKING CHANGE 1: Overly restrictive threshold (fails real transactions below $2,000.00)
        minimum: 2000.00
      payment_method:
        type: varchar
        required: true
        # ⚠️ BREAKING CHANGE 2: Arbitrary removal of PIX and BOLETO from allowed enum
        enum:
          - CRYPTO_TRANSFER
          - INTERNATIONAL_WIRE
      status:
        type: varchar
        required: true
      fee:
        type: decimal
        required: true
      currency:
        type: varchar
        required: true
      created_at:
        type: timestamp
        required: true
      # ⚠️ BREAKING CHANGE 3: Mandatory field added without backwards compatibility
      merchant_tax_id:
        type: varchar
        required: true

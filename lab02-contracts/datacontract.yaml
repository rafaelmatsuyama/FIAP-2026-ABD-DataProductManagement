dataContractSpecification: 0.9.3
id: urn:datacontract:fintech:transactions:v1
info:
  title: Financial Risk & Payment Transactions Product
  version: 1.0.0
  status: active
  description: Analytical payment transactions dataset powering credit risk models, fraud detection algorithms, and regulatory compliance reporting.
  owner: Fraud Prevention & Risk Analytics Squad
  contact:
    name: Data Engineering Team & DPO
    email: dpo.risk@company.com

servers:
  local:
    type: duckdb
    database: data/analytics.duckdb
    description: Local embedded DuckDB analytical database serving the transactions table.

models:
  transactions:
    description: Consolidated financial transaction events partitioned across payment arrangements.
    type: table
    fields:
      transaction_id:
        type: varchar
        primary: true
        required: true
        unique: true
        description: Globally unique financial transaction identifier.
      customer_id:
        type: varchar
        required: true
        pii: true
        classification: confidential
        description: Pseudonymized identifier representing the paying customer.
      amount:
        type: decimal
        required: true
        minimum: 0.01
        description: Net financial settlement amount of the transaction.
      payment_method:
        type: varchar
        required: true
        enum:
          - PIX
          - CREDIT_CARD
          - DEBIT_CARD
          - BOLETO
        description: Authorized payment method or settlement rail used.
      status:
        type: varchar
        required: true
        enum:
          - COMPLETED
          - PENDING
          - FAILED
        description: Operational transaction processing state.
      fee:
        type: decimal
        required: true
        minimum: 0.00
        description: Settlement transaction processing fee charged.
      currency:
        type: varchar
        required: true
        enum:
          - BRL
          - USD
          - EUR
        description: Transaction ISO 4217 currency code.
      created_at:
        type: timestamp
        required: true
        description: Origin system transaction registration timestamp.

servicelevels:
  freshness:
    threshold: 15m
    description: Maximum 15-minute latency between transaction execution and output port availability.
  frequency:
    type: microbatch
    description: Ingestion pipeline executes in micro-batches every 5 minutes.
  retention:
    period: 365d
    description: Mandatory 365-day partitioned historical retention for regulatory compliance.

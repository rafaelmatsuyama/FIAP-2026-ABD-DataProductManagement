version: 2

models:
  - name: stg_transactions
    description: "Cleaned, typed, and standardized view of raw financial transaction events."
    columns:
      - name: transaction_id
        description: "Unique transaction identifier."
      - name: customer_id
        description: "Paying customer identifier."
      - name: amount
        description: "Gross monetary transaction amount."
      - name: fee
        description: "Associated processing fee."
      - name: currency
        description: "Currency code (e.g. BRL)."
      - name: status
        description: "Transaction processing status."
      - name: payment_method
        description: "Payment method or rail used."
      - name: created_at
        description: "Event registration timestamp."

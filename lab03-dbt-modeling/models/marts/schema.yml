version: 2

models:
  - name: fct_financial_transactions
    description: "Analytical mart of settled financial transactions (Enterprise Consumption Data Product)."
    config:
      contract:
        enforced: true
    columns:
      - name: transaction_id
        data_type: varchar
        description: "Universal unique transaction identifier."
        constraints:
          - type: not_null
      - name: customer_id
        data_type: varchar
        description: "Pseudonymized paying customer identifier."
        constraints:
          - type: not_null
      - name: amount
        data_type: double
        description: "Gross financial transaction amount."
      - name: fee
        data_type: double
        description: "Settlement processing fee charged."
      - name: net_amount
        data_type: double
        description: "Net settlement amount credited to recipient."
      - name: currency
        data_type: varchar
        description: "ISO 4217 currency code (e.g., BRL, USD)."
      - name: status
        data_type: varchar
        description: "Operational settlement status of the transaction."
      - name: payment_method
        data_type: varchar
        description: "Payment method processed (PIX, CREDIT_CARD, BOLETO)."
      - name: created_at
        data_type: timestamp
        description: "Timestamp of transaction event processing."

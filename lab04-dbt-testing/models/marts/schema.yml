version: 2

models:
  - name: dim_customers
    description: "Active customer dimension."
    columns:
      - name: customer_id
        description: "Primary key of customer."
        data_tests:
          - unique
          - not_null
      - name: customer_name
        description: "Customer display name."
      - name: customer_tier
        description: "Loyalty tier."

  - name: fct_financial_transactions
    description: "Analytical mart of settled financial transactions with statistical and domain quality tests."
    config:
      contract:
        enforced: true
    data_tests:
      # Statistical batch volumetry test (dbt-expectations)
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 500
            max_value: 1500
    columns:
      - name: transaction_id
        data_type: varchar
        description: "Unique financial transaction identifier."
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
          # Regex pattern validation test (dbt-expectations)
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^TX_[0-9]+$'

      - name: customer_id
        data_type: varchar
        description: "Foreign key referencing paying customer."
        constraints:
          - type: not_null
        data_tests:
          - not_null
          # Native referential integrity test with modern syntax
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: amount
        data_type: double
        description: "Gross transaction amount."
        data_tests:
          - not_null
          # Business value range test (dbt-expectations)
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.01
                max_value: 5000.00

      - name: fee
        data_type: double
        description: "Associated processing fee."

      - name: net_amount
        data_type: double
        description: "Net settlement amount credited to recipient."
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.00
                max_value: 5000.00

      - name: currency
        data_type: varchar
        description: "ISO 4217 currency code."

      - name: status
        data_type: varchar
        description: "Settlement processing status."
        data_tests:
          - accepted_values:
              arguments:
                values: ['COMPLETED']

      - name: payment_method
        data_type: varchar
        description: "Payment method processed."

      - name: created_at
        data_type: timestamp
        description: "Timestamp of transaction event processing."

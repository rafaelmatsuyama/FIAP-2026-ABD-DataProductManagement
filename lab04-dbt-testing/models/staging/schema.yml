version: 2

models:
  - name: stg_transactions
    description: "Standardized and cleaned view of raw financial transactions."
    columns:
      - name: transaction_id
        description: "Unique transaction identifier."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Paying customer identifier."
        data_tests:
          - not_null
      - name: amount
        description: "Gross monetary transaction amount."
        data_tests:
          - not_null
      - name: status
        description: "Processing status."
        data_tests:
          - accepted_values:
              arguments:
                values: ['COMPLETED', 'FAILED']
      - name: payment_method
        description: "Payment method or rail."
        data_tests:
          - accepted_values:
              arguments:
                values: ['PIX', 'CREDIT_CARD', 'BOLETO']

  - name: stg_customers
    description: "Standardized view of registered customers."
    columns:
      - name: customer_id
        description: "Primary key of customer."
        data_tests:
          - unique
          - not_null
      - name: customer_tier
        description: "Customer loyalty tier."
        data_tests:
          - accepted_values:
              arguments:
                values: ['STANDARD', 'GOLD', 'VIP']
